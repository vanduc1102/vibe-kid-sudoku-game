name: Merge Check

on:
  push:
    branches:
      - main
      - master

jobs:
  verify-merge:
    name: Verify Build After Merge
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Confirm build output exists
        run: |
          echo "✅ Build succeeded. Contents of dist/:"
          ls -la dist/
