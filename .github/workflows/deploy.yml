name: Deploy to GitHub Pages

on:
  release:
    types: [published]

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
# and to commit the updated package.json version back to the repo.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment; do NOT cancel in-progress runs.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Bump version & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history needed so we can push the version bump commit
          fetch-depth: 0
          ref: ${{ github.event.release.target_commitish || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Bump version in package.json
        run: |
          # Strip leading 'v' from the tag (e.g. v1.2.3 → 1.2.3)
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"

          # Fall back gracefully when triggered via workflow_dispatch (no release tag)
          if [ -z "$VERSION" ]; then
            echo "No release tag found — skipping version bump."
          else
            echo "Setting version to $VERSION"
            npm version "$VERSION" --no-git-tag-version
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: bump version to $VERSION [skip ci]"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
